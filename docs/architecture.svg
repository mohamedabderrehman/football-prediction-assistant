<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Football Prediction Assistant architecture</title><desc id="desc">User asks about standings or a match → teams/league are resolved → provider data is assembled → features and heuristic score are calculated → AI explains the supplied evidence → response reports provider usage.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2847e7"/></marker></defs><rect width="1200" height="460" rx="16" fill="#f5f4ef"/><text x="40" y="54" font-family="sans-serif" font-size="26" fill="#171b26">Football Prediction Assistant · component relationships</text><path d="M290 240H323" stroke="#2847e7" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="120" width="250" height="235" rx="12" fill="white" stroke="#d6d7d3"/><text x="60" y="160" font-family="monospace" font-size="15" fill="#2847e7">01</text><text x="60" y="205" font-family="sans-serif" font-size="17" fill="#171b26">Next.js interface</text><text x="60" y="247" font-family="sans-serif" font-size="17" fill="#171b26">Arabic / English analysis</text><path d="M580 240H613" stroke="#2847e7" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="120" width="250" height="235" rx="12" fill="white" stroke="#d6d7d3"/><text x="350" y="160" font-family="monospace" font-size="15" fill="#2847e7">02</text><text x="350" y="205" font-family="sans-serif" font-size="17" fill="#171b26">Express / TypeScript</text><text x="350" y="247" font-family="sans-serif" font-size="17" fill="#171b26">Feature / heuristic score</text><path d="M870 240H903" stroke="#2847e7" stroke-width="3" marker-end="url(#arrow)"/><rect x="620" y="120" width="250" height="235" rx="12" fill="white" stroke="#d6d7d3"/><text x="640" y="160" font-family="monospace" font-size="15" fill="#2847e7">03</text><text x="640" y="205" font-family="sans-serif" font-size="17" fill="#171b26">Fixture or sports data</text><text x="640" y="247" font-family="sans-serif" font-size="17" fill="#171b26">Provider cache</text><rect x="910" y="120" width="250" height="235" rx="12" fill="white" stroke="#d6d7d3"/><text x="930" y="160" font-family="monospace" font-size="15" fill="#2847e7">04</text><text x="930" y="205" font-family="sans-serif" font-size="17" fill="#171b26">Prompt / output parser</text><text x="930" y="247" font-family="sans-serif" font-size="17" fill="#171b26">Optional AI explanation</text><text x="40" y="418" font-family="sans-serif" font-size="15" fill="#555a68">Source-based overview. Arrows describe workflow relationships, not deployment topology.</text></svg>